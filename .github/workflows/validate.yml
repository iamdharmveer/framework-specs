name: validate-framework
on:
  # 'production' added by GAP-2026-08-12-NAPARSE §12 item 8: mirror.yml acts on
  # production and SKILL.md Step 0 clones production, but nothing validated it —
  # a direct push to production (the manual deploy path) reached every project
  # unchecked. CI cannot BLOCK a push, so branch protection on production
  # (require PR from main, no direct pushes) is still the real gate; this
  # trigger makes any bypass turn the branch red immediately.
  push: { branches: [ main, production ] }
  pull_request: { branches: [ main ] }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install validator runtime deps
        # python-docx: embedded self-tests build documents. matplotlib/pillow/
        # numpy: without them the engines' figure checks go DORMANT, and a
        # dormant test is exactly where a mutation survivor could hide — the
        # mutation gate below is only meaningful if CI runs the same test
        # surface the local verification env runs.
        run: pip install python-docx matplotlib pillow numpy rdkit openpyxl
      - name: Manifest must be up to date
        run: |
          python3 gen_manifest.py
          git diff --exit-code MANIFEST.json \
            || (echo "::error::MANIFEST.json stale. Run gen_manifest.py and commit." && exit 1)
      # ISSUE-2026.08.22.6-SPECMANIFESTSTALE: release 2026.08.22.6 shipped a bundle
      # whose SPEC_MANIFEST.json still described the pre-edit audit_deep.py — every
      # local gate was green because NOTHING in this workflow ran the freshness
      # checks; CLAUDE.md's prose said "run --check in the gate" but the gate never
      # existed here. Same class as GAP-2026-08-14-CI-AUDITOR-WIRING: a check that
      # exists in the repo but never runs in the gating path is not a check. The
      # deploy environment's own gate caught it; these two steps make the class
      # impossible to land — and every session that follows the "run the gate list
      # from validate.yml" law now inherits them mechanically.
      - name: SPEC_MANIFEST must be current (tracks auditors/engines gen_manifest does not)
        run: python3 build_spec_manifest.py --check
      - name: SPEC_SECTIONS must be current (generated read-set ranges vs live spec headers)
        run: python3 spec_sections.py --check
      - name: Whole-framework verify gate must pass
        run: python3 bootstrap.py
      - name: Framework markdown validator (if present)
        run: if [ -f validate_framework_md.py ]; then python3 validate_framework_md.py Framework_*.md; fi
      - name: Trigger names consistent (skill == routes.json == PIPELINE)
        run: if [ -f check_triggers.py ]; then python3 check_triggers.py; fi
      - name: Notes cross-step sync audit (specs vs engines)
        run: if [ -f notes_sync_audit.py ]; then python3 notes_sync_audit.py; fi
      - name: Notes engine self-tests
        run: |
          for m in notes_core notes_docx notes_audit notes_blueprint notes_sync_audit; do
            [ -f "$m.py" ] && python3 "$m.py" --self-test
          done
      - name: Final Assembly engine self-test (GAP-2026-08-12-FINAL-ASSEMBLY-ENGINE)
        run: if [ -f final_assembly.py ]; then python3 final_assembly.py --self-test; fi
      - name: Spec-inline undefined-name audit (GAP-2026-08-12-SPEC-INLINE-NAME-AUDIT)
        run: |
          if [ -f spec_name_audit.py ]; then
            python3 spec_name_audit.py --self-test
            python3 spec_name_audit.py --check-baseline spec_name_audit_baseline.json Framework_*.md
          fi
      - name: Mock-track cross-step sync audit (GAP-2026-08-13-MOCK-SYNC-AUDIT)
        run: |
          if [ -f mock_sync_audit.py ]; then
            python3 mock_sync_audit.py --self-test
            python3 mock_sync_audit.py
          fi
      # ---- GAP-2026-08-14-CI-AUDITOR-WIRING: the six auditors below existed
      # in the repo but never ran in CI, so a regression any of them catches
      # (the AXISPAPER-PERSISTENCE seam break included) could only be found
      # by someone running them by hand after the fact. Wired as blocking
      # gates; audit_seam runs in KNOWN-BASELINE mode until that pre-existing
      # regression is fixed (see the step's own comment).
      # GAP-2026-08-14-AUDITOR-SELFTESTS: each of the five gates below runs
      # its own --self-test FIRST (mutate-a-copy fixtures proving every check
      # class still fires), then the audit itself — the same watch-the-watcher
      # discipline notes_sync_audit / mock_sync_audit / spec_name_audit
      # already follow. A blocking gate that could silently go blind is not a
      # gate; the seam auditor's own five-finding saga proved it.
      - name: Deep spec-vs-engine parity audit
        run: |
          if [ -f audit_deep.py ]; then
            python3 audit_deep.py --self-test
            python3 audit_deep.py
          fi
      - name: Call-graph / return-shape audit
        run: |
          if [ -f audit_callgraph.py ]; then
            python3 audit_callgraph.py --self-test
            python3 audit_callgraph.py
          fi
      - name: Whole-corpus sync audit
        run: |
          if [ -f audit_sync.py ]; then
            python3 audit_sync.py --self-test
            python3 audit_sync.py
          fi
      # GAP-2026-08-23-AUDITSYNC-FIXTURE-STALE (deploy block #3 of 2026-08-23).
      # The deploy environment runs engine self-tests this workflow never listed,
      # so a verification that executed this file VERBATIM was still a SUBSET of
      # the deploy gate — and the block hid in the difference. A hand-maintained
      # list would recreate the gap on the next engine; DISCOVERY closes it:
      # every .py that advertises a --self-test entrypoint runs here, including
      # engines added after this comment was written. Redundant with the
      # dedicated steps above for a few engines — redundancy is cheap, a gap
      # is not.
      - name: Every advertised engine self-test passes (discovery-driven)
        run: |
          fails=""
          for f in *.py; do
            grep -q -- "--self-test" "$f" || continue
            grep -qE "def self_test|_self_test" "$f" || continue
            echo "== $f --self-test"
            python3 "$f" --self-test || fails="$fails $f"
          done
          if [ -n "$fails" ]; then echo "SELF-TEST FAILURES:$fails"; exit 1; fi
      - name: Supplementary spec deep audit (V/W/X/Y/Z families)
        # Sync-rule parity needs the ENGINE side of every rule in the same
        # run, so the .py files are passed alongside the specs — specs alone
        # report V-SCOPE "parity UNVERIFIED".
        run: |
          if [ -f audit_specs_ext.py ]; then
            python3 audit_specs_ext.py --self-test
            python3 audit_specs_ext.py Framework_*.md *.py
          fi
      - name: Structural seam audit
        # STRICT since GAP-2026-08-14-AXISPAPER-PERSISTENCE was resolved
        # (audit_seam.py v1.1: final_assembly.py registered on the seam; the
        # two Step-7-internal accumulators and the report-only mechanism-lock
        # ALLOW-listed with reasons). The self-test pins those three ALLOW
        # justifications as STANDING guards and keeps the AXISPAPER mutation
        # evidence as a permanent fixture.
        run: |
          if [ -f audit_seam.py ]; then
            python3 audit_seam.py --self-test
            python3 audit_seam.py
          fi
      - name: Mutation auditor self-test (B7 — watch the watcher)
        # The gate whose job is proving other tests are connected had no test of its
        # own. B7 found the cost: a `sorted(` inside a NESTED test helper's docstring
        # was listed as a live mutation target and counted as a surviving mutant of the
        # production engine. Milliseconds, no filesystem, runs before the gate it guards.
        run: if [ -f audit_mutation.py ]; then python3 audit_mutation.py --self-test; fi
      - name: Mutation audit (gate tests must kill every mutant)
        # ~4 minutes: mutates the engine gates and requires the self-tests to
        # catch every mutant. --max-survivors 0 == a gate whose test cannot
        # detect its own deletion fails the build.
        run: if [ -f audit_mutation.py ]; then python3 audit_mutation.py --quiet --max-survivors 0; fi
      - name: Step 5 transport engine self-test (Wave 2 Part C B9)
        # transport_core.py decides WHICH PAPERS A SESSION FETCHES. Its 49 fixtures
        # inject every dependency by swapping module globals — no filesystem, no
        # connector — so the suite runs identically here and on a runner
        # (GAP-2026-08-17-B4-ENV-SKEW: a fixture that needs /mnt is a fixture that
        # SKIPS, and a skipped assertion reads exactly like a passing one).
        run: if [ -f transport_core.py ]; then python3 transport_core.py --self-test; fi
      - name: Mutation audit — Step 5 transport engine (Wave 2 Part C B9)
        # Small surface by nature — mostly straight-line reporting and delegation — so
        # the budget is 0 and the fixtures, not the mutants, are what hold this file.
        # Kept as a gate anyway: audit_mutation exits 1 on ZERO targets, so this engine
        # can never silently bank a vacuous 0/0 = 100% the way analyse_engine.py did.
        run: |
          if [ -f audit_mutation.py ] && [ -f transport_core.py ]; then
            python3 audit_mutation.py --engine transport_core.py --quiet
          fi
      - name: Mutation audit — Step 5 pipeline engine (Wave 2 Part C B4)
        # analyse_engine.py computes values rather than emitting findings, so the
        # auditor mutation model found 0 targets and the largest engine in the repo
        # was outside the gate. --kind pipeline mutates decision points instead.
        # The budget is read from MUTATION_BUDGETS.json and is DEBT: it may only
        # ever be lowered. Raising it to make a build pass is the move this file
        # exists to make visible in a diff.
        run: |
          if [ -f audit_mutation.py ] && [ -f analyse_engine.py ]; then
            python3 audit_mutation.py --engine analyse_engine.py --quiet
          fi
